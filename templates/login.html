<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Admin Login</title>

  <style>
    :root{
      --bg-main:#0b0f14;
      --bg-mid:#121821;
      --glass:rgba(255,255,255,0.05);
      --border:rgba(255,255,255,0.08);
      --text:#e5e7eb;
      --muted:#9ca3af;
      --accent1:#22c55e;
      --accent2:#16a34a;
      --danger:#ef4444;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      height:100vh;
      font-family:"Inter","Segoe UI",Arial,sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(1200px 600px at 50% -200px, var(--bg-mid), transparent),
        linear-gradient(180deg, var(--bg-main), var(--bg-main));
      color:var(--text);
    }

    .login-box{
      width:360px;
      padding:28px 26px 30px;
      border-radius:20px;
      background:var(--glass);
      border:1px solid var(--border);
      backdrop-filter:blur(12px);
      box-shadow:0 20px 50px rgba(0,0,0,.55);
      text-align:center;
    }

    .logo{
      width:56px;
      height:56px;
      margin:0 auto 14px;
      border-radius:16px;
      background:linear-gradient(135deg,var(--accent1),var(--accent2));
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      color:#052e16;
      font-size:20px;
    }

    h1{
      margin:0;
      font-size:16px;
      letter-spacing:2px;
      font-weight:600;
    }

    .subtitle{
      font-size:12px;
      color:var(--muted);
      margin-top:4px;
      margin-bottom:22px;
    }

    input[type="password"]{
      width:100%;
      padding:12px 14px;
      border-radius:12px;
      border:1px solid var(--border);
      background:rgba(255,255,255,0.04);
      color:var(--text);
      font-size:14px;
      outline:none;
    }

    input::placeholder{
      color:#6b7280;
    }

    input:focus{
      border-color:var(--accent1);
      box-shadow:0 0 0 2px rgba(34,197,94,.25);
    }

    button{
      width:100%;
      margin-top:18px;
      padding:12px;
      border:none;
      border-radius:999px;
      font-size:13px;
      font-weight:600;
      color:#ecfdf5;
      background:linear-gradient(135deg,var(--accent1),var(--accent2));
      cursor:pointer;
      box-shadow:0 6px 18px rgba(0,0,0,.4);
      transition:.25s;
    }

    button:hover{
      transform:translateY(-1px);
      box-shadow:0 10px 26px rgba(0,0,0,.5);
    }

    .error{
      margin-top:14px;
      font-size:12px;
      color:var(--danger);
    }

    .back{
      margin-top:18px;
      display:block;
      font-size:12px;
      color:var(--muted);
      text-decoration:none;
    }

    .back:hover{
      color:var(--text);
    }
  </style>
</head>

<body>

<div class="login-box">
  <div class="logo">AI</div>

  <h1>ADMIN ACCESS</h1>
  <div class="subtitle">Restricted system area</div>

  <form method="post" action="/login">
    <input
      type="password"
      name="password"
      placeholder="Enter admin password"
      required
      autofocus
    />
    <button type="submit">Login</button>
  </form>

  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}

  <a class="back" href="/">← Back to camera</a>
</div>

</body>
</html>
